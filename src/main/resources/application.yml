server:
  port: 28080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: investment-platform

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://120.24.176.90:33071/investment?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: tqgmysql
    password: ${DB_PASSWORD:8rfrrK7tiy}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-jwt-token-generation-must-be-at-least-256-bits}
  access-token-expiration: 7200000  # 2 hours
  refresh-token-expiration: 2592000000  # 30 days
  issuer: investment-platform

# File Upload Configuration
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    max-size: 52428800  # 50MB
    allowed-types: pdf,doc,docx,ppt,pptx,jpg,jpeg,png,gif

# SMS Configuration (Mock)
sms:
  enabled: false
  provider: mock
  mock-code: "123456"

# AI Analysis Configuration (Mock)
ai:
  analysis:
    enabled: true
    provider: mock
    timeout: 60000

# SpringDoc Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.investment: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
